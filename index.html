<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Mini Task Manager</h1>
      <p>Bài kiểm tra thực hành HTML, CSS, JavaScript</p>
    </div>
  </header>

  <main class="container">
    <!-- A: Form thêm công việc -->
    <section class="form-section">
      <h2>Thêm công việc mới</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Tên công việc <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="Nhập tên công việc..." required>
          <span class="error-message" id="title-error"></span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-due">Hạn hoàn thành</label>
            <input type="date" id="task-due">
          </div>
          <div class="form-group">
            <label for="task-priority">Mức ưu tiên</label>
            <select id="task-priority">
              <option value="Cao">Cao</option>
              <option value="Trung bình" selected>Trung bình</option>
              <option value="Thấp">Thấp</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-add">Thêm</button>
      </form>
    </section>

    <!-- A: Tìm kiếm, lọc trạng thái và vùng danh sách -->
    <section class="toolbar-section">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Tìm kiếm theo tên...">
        </div>
        <div class="filter-box">
          <label for="status-filter">Lọc trạng thái:</label>
          <select id="status-filter">
            <option value="all">Tất cả</option>
            <option value="pending">Chưa hoàn thành</option>
            <option value="done">Đã hoàn thành</option>
          </select>
        </div>
      </div>
    </section>

    <section class="list-section">
      <h2>Danh sách công việc</h2>
      <div id="task-list" class="task-list">
        <!-- Dữ liệu sẽ được render bằng JavaScript -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Sinh viên: Phạm Văn Hiệp | MSV: 224001717 | Lớp: TUD D2024
  </footer>
</body>
</html>
